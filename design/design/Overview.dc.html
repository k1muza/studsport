<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<title>Overview · StudSport prototype</title>
<meta name="design_doc_mode" content="canvas">
<link href="https://fonts.googleapis.com/css2?family=Martian+Mono:wght@400;500&amp;family=Schibsted+Grotesk:wght@600;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#e6e6e3;font-family:'Schibsted Grotesk',system-ui,sans-serif;color:#15171a}
*{box-sizing:border-box}
a{color:inherit}
a:hover{color:oklch(0.55 0.16 45)}
</style>
</helmet>
<section style="padding:64px;display:flex;flex-direction:column;gap:56px;width:max-content">
  <header style="display:flex;flex-direction:column;gap:10px">
    <span style="font-family:'Martian Mono',monospace;font-size:13px;letter-spacing:0.12em;color:oklch(0.55 0.16 45)">STUDSPORT · PROTOTYPE OVERVIEW</span>
    <h1 style="margin:0;font-size:56px;font-weight:800;letter-spacing:-0.04em">Desktop and mobile</h1>
    <p style="margin:0;font-size:18px;color:#4b5157">Each frame is the live page. Open a page directly for the full interactive prototype. Sample data is illustrative.</p>
  </header>
  <div style="display:flex;flex-direction:column;gap:20px">
    <span style="font-family:'Martian Mono',monospace;font-size:13px;letter-spacing:0.1em;color:#4b5157">DESKTOP · 1440 × 900 SHOWN AT 50%</span>
    <div style="display:flex;gap:32px">
      <sc-for list="{{ pages }}" as="p" hint-placeholder-count="4">
        <div style="display:flex;flex-direction:column;gap:10px">
          <a href="{{ p.href }}" style="font-size:17px;font-weight:600;text-decoration:none">{{ p.label }} ↗</a>
          <div style="width:720px;height:450px;overflow:hidden;background:#121416;box-shadow:0 1px 0 rgba(0,0,0,0.06),0 18px 40px rgba(18,20,22,0.18)">
            <iframe src="{{ p.href }}" loading="lazy" title="{{ p.label }} desktop" style="width:1440px;height:900px;border:0;transform:scale(0.5);transform-origin:0 0"></iframe>
          </div>
        </div>
      </sc-for>
    </div>
  </div>
  <div style="display:flex;flex-direction:column;gap:20px">
    <span style="font-family:'Martian Mono',monospace;font-size:13px;letter-spacing:0.1em;color:#4b5157">MOBILE · 390 × 844</span>
    <div style="display:flex;gap:32px;align-items:flex-start">
      <sc-for list="{{ pages }}" as="p" hint-placeholder-count="4">
        <div style="display:flex;flex-direction:column;gap:10px">
          <span style="font-size:17px;font-weight:600">{{ p.label }}</span>
          <div style="width:390px;height:844px;overflow:hidden;background:#121416;border-radius:28px;border:8px solid #15171a;box-shadow:0 18px 40px rgba(18,20,22,0.2)">
            <iframe src="{{ p.href }}" loading="lazy" title="{{ p.label }} mobile" style="width:374px;height:828px;border:0;display:block"></iframe>
          </div>
        </div>
      </sc-for>
      <div style="display:flex;flex-direction:column;gap:10px">
        <a href="SpecSheet.dc.html?p=ss-1030" style="font-size:17px;font-weight:600;text-decoration:none">Spec sheet · A4 ↗</a>
        <div style="width:595px;height:842px;overflow:hidden;background:#ffffff;box-shadow:0 18px 40px rgba(18,20,22,0.18)">
          <iframe src="SpecSheet.dc.html?p=ss-1030" loading="lazy" title="Spec sheet" style="width:900px;height:1280px;border:0;transform:scale(0.661);transform-origin:0 0"></iframe>
        </div>
      </div>
    </div>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    return { pages: [
      { label: 'Homepage', href: 'Home.dc.html' },
      { label: 'Catalogue', href: 'Catalogue.dc.html' },
      { label: 'Product detail', href: 'Product.dc.html?p=ss-1001' },
      { label: 'Find my part', href: 'FindMyPart.dc.html?part=SS-1001&qty=10' }
    ] };
  }
}
</script>
</body>
</html>
